<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" contents="width=device-width, initial-scale=1.0">
        <title>Input Types</title>
</head>
<body>
    <form> 
          <label> First Name : </label>
         <input type="text"> <br><br>

         <label> Date of Birth: </label>
         <input type="date"> <br>
        

<!-- to create checkbox confirmation-->
        <fieldset>
           <legend> Confirmation</legend>
           <input type ="checkbox"> <label> I confirm the information provided is correct.
            </label> 
        </fieldset>
        <br>

<!-- Email -->
         <label> Email: </label>
         <input type="email"> <br><br>

<!-- Uploading a file photo-->
         <label>Your profile photo: </label>
         <input type="file"> <br><br>

<!-- Radio button -->
          <label> Year Level: </label> <br>
              <!-- putting name to know which is only selected -->
          <input type="radio" name="yrlevel">

          <label> First Year </label>
          <input type="radio" name="yrlevel">

          <label> Second Year </label>
          <input type="radio" name="yrlevel">

          <label> Third Year </label>
          <input type = "radio" name="yrlevel">

          <label> Fourth Year </label> <br>

<!-- Password inputs-->
          <label> Password: </label>
          <input type="password">

          <input type="submit">

    </form>
          
</body>
</html>
