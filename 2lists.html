<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title> <!-- for page title-->

    <!--This is a -->
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <!-- ul, ol, dl

    list : <li> </li>
    
   -->

    <!-- Unordered lists of cities-->

    <h5> Unordered lists </h5>
    <ul> 
         <!--"li" for list items-->
         <li> Lipa </li>
         <li> Batangas </li>
         <li> Manila </li>

    </ul>

    <!-- Ordered lists of cities -->
     <h5> Ordered lists </h5>
    <ol> 
        <li> Lipa </li>
         <li> Batangas </li>
         <li> Manila </li>

    </ol>

    <!-- Definition lists of cities -->
     <h5> Definition lists </h5>
     
     <dl> <!-- dl, declare description list-->

        <dt> Lipa </dt>  <!-- dt, description term tag-->
        <dd> City in Batangas</dd> <!--Description tag-->

        <dt> Batangas </dt>
        <dd> Province in Luzon</dd> 

        <dt> Manila </dt>
        <dd> Capital of the Philippines</dd>

     </dl>

 <img src="2lists-ss.png" alt="Screenshot of Lists">

</body>
</html>
