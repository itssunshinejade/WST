<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Column Span</title>

</head>

<!-- 
Col span attribiutes : determines the spaces it takes, 
merges multiple cells into one  -->

<!-- kumbaga sasakupin/kakainin nya yung column space;  vertical-->

<body>
    <table border="1px"> 
        <tr> 
            <th> Number </th>
            <th> Item </th>
            <th> Quantity </th>
        </tr>

        <tr> 
            <td> 1 </td>
            <td> Apple </td>
            <td> 5 </td>
        </tr>

        <tr> 
            <td> 2 </td>
            <td> Mango </td>
            <td> 2 </td>
        </tr>

        <tr> 
            <td> 3 </td>
            <td> Orange </td>
            <td> 1 </td>
        </tr>

        <tr> 
            <td colspan="2"> Total </td> 
            <!-- considered as three cells sha gawa nung col span -->

            <td> 8 </td>
        </tr>
<!-- Kasama sa col span ung bilang na need mo-->

    </table>

    <br><br>
<img src="7colspan-ss.png" alt="Colspan image">

</body>
</html>
