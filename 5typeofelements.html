<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" contents="width=device-width, initial-scale=1.0">
        <title>Types of Elements</title>  <!-- Title of the webpage -->
        <link rel="icon" type="image/x-icon" href="vielaboo-sleep.png"> <!-- Link to the CSS file (picture-like)-->
</head>
<body> 
<!--- Headings: h1, h2, h3, h4, h5, h6 -->
<!-- sa paglaki ng number sa pagliit -->
     <h1>This is an H1 heading</h1>
     <h2>This is an H2 heading</h2>
     <h3>This is an H3 heading</h3>
     <h4>This is an H4 heading</h4>
     <h5>This is an H5 heading</h5>
     <h6>This is an H6 heading</h6>

<!--- Paragraphs: "p" -->
     <p>This is a paragraph. A paragraph is a self-contained unit of discourse in writing </p>

<!-- Horizontal Rule -->
     <hr>
<!-- "a" anchor : connects linnks-->
    <a href="https://www.google.com"> This is a link to Google </a> <br>

    <br>
    <img src="vielaboo-sleep.png" alt= "Vielaboo sleeping">
            
            <!-- 
             "src" is the source of the image, same file dapat sa folder; 

             "alt" is the alternative text as description; 
             FALLBACK Guide, to use if the image cannot be displayed 
             
             -->

<!-- "< !-- -- >" act as note; is used as bookmark; to create comments in HTML --> 

</body> 
</html>
