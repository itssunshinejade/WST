<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linking and Applying CSS</title>
    <link rel="icon" type="image/x-icon" href="vielaboo-sleep.png">

   <!--This is for linking relationship icon on webpage -->
   <!-- calling style css sheet-->

    <link rel="stylesheet" href="style.css">

</head>


<body> 

    
 <!-- Table "table" tag; add border inline css basic-->
  <table border="1px"> 

        <!-- <tr></tr>table row, to create new rows..-->
    <tr> 
        <th> Name </th> <!-- Table tag "th" as our header -->
        <th>Address</th> 
        <th> Age </th>
        <th> Phone </th>
    </tr>

         <!--NOTE :  It reads from left to right-->


<!--  create another row <tr></tr>-->
    <tr> 
      <!-- "td" for our table data -->
      <td>Sun</td> 
      <td>Lipa</td>
      <td>19</td>
      <td>09</td>
    </tr>

  </table>



    <!-- 
    ul, ol, dl
    list : <li> </li>
    
   -->
    <!-- Unordered lists of cities-->

    <h5> Unordered lists </h5>
    <ul> 
         <!--"li" for list items-->
         <li> Lipa </li>
         <li> Batangas </li>
         <li> Manila </li>

    </ul>

    <!-- Ordered lists of cities -->
     <h5> Ordered lists </h5>
    <ol> 
        <li> Lipa </li>
         <li> Batangas </li>
         <li> Manila </li>

    </ol>

    <!-- Definition lists of cities -->
     <h5> Definition lists </h5>
     
     <dl> <!-- dl, declare description list-->

        <dt> Lipa </dt>  <!-- dt, description term tag-->
        <dd> City in Batangas</dd> <!--Description tag-->

        <dt> Batangas </dt>
        <dd> Province in Luzon</dd> 

        <dt> Manila </dt>
        <dd> Capital of the Philippines</dd>

     </dl>

 <img src="2lists-ss.png" alt="Screenshot of Lists">

</body>
</html>
